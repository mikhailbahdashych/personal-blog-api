name: build-and-deploy

on:
  push:
    branches: [master]
  # PRs run the checks only; build and deploy are skipped (see `if:` below).
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/personal-blog-api

jobs:
  test:
    runs-on: ubuntu-latest
    # Matches docker-compose.dev.yml. Storage is the compose file's S3Mock, not
    # the real bucket: CI must not write to S3, and the asset test reads its
    # upload back anonymously, which the bucket only allows under prod/.
    env:
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://blog:blog@localhost:5433/personal_blog
      DATABASE_SSL: 'false'
      JWT_SECRET: ci-only-jwt-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: personal-blog-dev
      S3_KEY_PREFIX: ci
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_PUBLIC_URL: http://localhost:9000/personal-blog-dev
      FRONT_INTERNAL_URL: http://localhost:3000
      REVALIDATE_SECRET: ci-only-revalidate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Start Postgres and S3Mock
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait db s3
          # S3Mock has no healthcheck (no curl in the image); poll from here.
          timeout 60 sh -c 'until curl -sf -o /dev/null http://localhost:9000/; do sleep 1; done'
      - run: npm run migrate
      - run: npm run test:e2e

  build:
    needs: test
    # Checks only on pull requests; deploy needs build, so it skips with it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # One deploy at a time; job-level so PR checks never queue behind a deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve runner IP
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      # SSH is closed by default; open it only for this runner, only for the
      # duration of the deploy (revoked below even when the deploy fails).
      - name: Open SSH to runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}/32"

      - name: Deploy
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (EC2_SSH_HOST_KEY = `ssh-keyscan -t ed25519 <host>` output):
          # an ephemeral runner has no TOFU history, so accept-new would trust
          # any host that answers.
          echo "${{ secrets.EC2_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          # /opt/blog is a checkout of personal-blog-infrastructure (which owns
          # the compose stack and nginx config); this pipeline only rolls the
          # api service to the freshly built image.
          # GHCR auth: this run's short-lived GITHUB_TOKEN piped over stdin, so
          # the host never stores a static PAT.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }}" \
            'docker login ghcr.io -u ${{ github.actor }} --password-stdin \
             && cd /opt/blog \
             && docker compose -f docker-compose.prod.yml pull api \
             && docker compose -f docker-compose.prod.yml up -d api \
             && docker compose -f docker-compose.prod.yml exec -T api node dist/db/migrate.js \
             && docker image prune -f \
             && docker logout ghcr.io'

      - name: Revoke SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}/32"
