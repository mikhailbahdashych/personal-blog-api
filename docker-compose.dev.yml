services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: personal_blog
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d personal_blog']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for offline dev and CI. MinIO's images were removed
  # from Docker Hub and Quay, so this is Adobe's S3Mock: it creates the bucket
  # itself, accepts any key pair and serves objects anonymously (like prod/ on
  # the real bucket). Host port 9000 keeps the old MinIO URLs valid.
  s3:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    # The image runs as uid 1000 and can't write to a fresh (root-owned) volume.
    user: '0'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: personal-blog-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9000:9090'
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
